<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Door Controller</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="screen active">
        <div class="login-container">
            <h1 class="glow-text">Door Controller</h1>
            <div class="login-box">
                <input type="text" id="username" placeholder="Username" class="input-field">
                <input type="password" id="password" placeholder="Password" class="input-field">
                <button onclick="login()" class="btn btn-primary">Login</button>
                <p id="loginError" class="error-message"></p>
            </div>
        </div>
    </div>

    <!-- Server Selection Screen -->
    <div id="serverScreen" class="screen">
        <div class="dashboard-container">
            <div class="header">
                <h1 class="glow-text">Select Server</h1>
                <button onclick="logout()" class="btn btn-logout">Logout</button>
            </div>
            
            <div class="welcome-card">
                <p>Welcome, <span id="currentUser"></span>! Select a server to control doors.</p>
            </div>

            <div class="search-container">
                <input type="text" id="serverSearch" placeholder="🔍 Search servers..." class="search-bar" oninput="filterServers()">
            </div>

            <div class="server-grid" id="serverGrid">
                <!-- Servers will be populated here -->
            </div>

            <!-- Admin Panel -->
            <div id="adminPanel" class="admin-panel" style="display: none;">
                <h2>User Management</h2>
                <div class="user-list" id="userList"></div>
                <div class="add-user-form">
                    <h3>Add New User</h3>
                    <input type="text" id="newUsername" placeholder="Username" class="input-field">
                    <input type="password" id="newPassword" placeholder="Password" class="input-field">
                    <button onclick="addUser()" class="btn btn-primary">Add User</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Door Control Screen -->
    <div id="controlScreen" class="screen">
        <div class="dashboard-container">
            <div class="header">
                <button onclick="backToServers()" class="btn btn-back">← Back to Servers</button>
                <h1 class="glow-text">Door Control</h1>
                <button onclick="logout()" class="btn btn-logout">Logout</button>
            </div>

            <div class="server-info-card">
                <div class="server-info-item">
                    <span class="info-label">Server:</span>
                    <span id="selectedServerName" class="info-value"></span>
                </div>
                <div class="server-info-item">
                    <span class="info-label">Players:</span>
                    <span id="selectedServerPlayers" class="info-value"></span>
                </div>
                <div class="server-info-item">
                    <span class="info-label">Status:</span>
                    <span id="connectionStatus" class="status-badge">Connected</span>
                </div>
            </div>

            <div class="search-container">
                <input type="text" id="doorSearch" placeholder="🔍 Search doors..." class="search-bar" oninput="filterDoors()">
            </div>

            <!-- Door Categories -->
            <div class="category-section">
                <h2 class="category-title">Main Doors</h2>
                <div class="door-button-grid" id="mainDoors">
                    <!-- Main doors will be populated here -->
                </div>
            </div>

            <div class="category-section">
                <h2 class="category-title">Room Doors</h2>
                <div class="door-button-grid" id="roomDoors">
                    <!-- Room doors will be populated here -->
                </div>
            </div>

            <div class="category-section">
                <h2 class="category-title">Special Doors</h2>
                <div class="door-button-grid" id="specialDoors">
                    <!-- Special doors will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
